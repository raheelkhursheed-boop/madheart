<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curation desk · silkroute.art</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12100D">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
<style>
body{font-size:16px}
.desk{max-width:1400px;margin:0 auto;padding:28px var(--gutter) 80px}
.desk h1{font-size:clamp(34px,3.6vw,48px);font-weight:300;letter-spacing:-.03em}
.desk h1 em{font-style:italic;color:var(--saffron)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:22px 0 0;border-bottom:1px solid var(--ink)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 14px;font:600 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.tabs button b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:15px;letter-spacing:0;margin-left:6px;color:var(--ink-3)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--saffron)}
.tabs button[aria-selected=true] b{color:var(--saffron)}
.grid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:32px;margin-top:24px;align-items:start}
.list{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.card{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:12px;background:var(--paper);border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.card:hover{background:#fff}
.card[aria-current=true]{background:#fff;box-shadow:inset 3px 0 0 var(--saffron)}
.card img,.card .ph{width:72px;height:72px;object-fit:cover;background:var(--paper-2);display:block}
.card h3{font-size:19px;margin:2px 0 2px;line-height:1.2}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);background:var(--paper);font-family:var(--serif);font-style:italic;font-size:19px}
.detail{background:#fff;border:1px solid var(--rule);padding:clamp(18px,2.4vw,32px);min-height:320px}
.detail .hero{display:grid;grid-template-columns:1fr;gap:10px}
.detail .big{width:100%;max-height:62vh;object-fit:contain;background:var(--paper-2);display:block}
.detail .strip{display:flex;gap:8px;flex-wrap:wrap}
.detail .strip button{padding:0;border:1px solid transparent;background:none;cursor:pointer}
.detail .strip button[aria-current=true]{border-color:var(--saffron)}
.detail .strip img{width:64px;height:64px;object-fit:cover;display:block}
.detail h2{font-size:clamp(28px,2.8vw,38px);margin:22px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:26px}
.panel h4{font:600 11.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--saffron);margin:0 0 12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;word-break:break-word}
.bio{font-size:15px;color:var(--ink-2);margin-top:12px;white-space:pre-wrap}
.cur{margin-top:28px;padding:22px;background:var(--paper);border:1px solid var(--rule)}
.cur .fields{grid-template-columns:repeat(3,1fr)}
.log{margin-top:26px;font-size:13.5px;color:var(--ink-3)}
.log li{margin:2px 0}
.ask{font-size:14.5px;color:var(--ink-2);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:var(--ivory);padding:12px 18px;font-size:14px;z-index:9}
details.edit summary{cursor:pointer;font:600 11.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin-top:22px}
.back{display:none}
@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .grid.open .list{display:none}
  .grid:not(.open) .detail{display:none}
  .back{display:inline-block;margin-bottom:14px}
  .two,.cur .fields{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="/"><img src="/markhor.svg" alt=""><span>silkroute<i>.art</i></span></a>
  <span class="where">Curation desk</span>
</div></header>

<main class="desk">
  <h1>The <em>curation</em> desk</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="grid" id="grid">
    <div class="list" id="list"><div class="empty">Loading…</div></div>
    <section class="detail" id="detail"><p class="muted" style="font-family:var(--serif);font-style:italic;font-size:20px">Choose a work to review it.</p></section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => (n == null || n === "" ? "—" : "$" + Number(n).toLocaleString("en-US"));
  const when = (s) => (s ? new Date(s).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "");
  const TABS = [
    ["submitted", "To review"], ["changes_requested", "Changes asked"], ["approved", "Accepted"],
    ["published", "On the gallery"], ["declined", "Declined"], ["sold", "Sold"], ["", "All"],
  ];
  const LABEL = { submitted: "To review", changes_requested: "Changes asked", approved: "Accepted, not yet on show", published: "On the gallery", declined: "Declined", held: "Held at checkout", sold: "Sold", shipped: "Shipped", delivered: "Delivered" };
  let tab = (location.hash.match(/tab=(\w*)/) || [])[1] ?? "submitted";
  let current = null;

  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); };

  async function api(path, body) {
    const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Request failed (" + r.status + ")");
    return d;
  }

  async function loadList() {
    const d = await api("/admin/api/works" + (tab ? "?status=" + tab : ""));
    const total = Object.values(d.counts).reduce((a, b) => a + b, 0);
    $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" data-k="${k}" aria-selected="${k === tab}">${l}<b>${k ? d.counts[k] || 0 : total}</b></button>`).join("");
    $("#tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { tab = b.dataset.k; location.hash = "tab=" + tab; loadList(); }));
    $("#list").innerHTML = d.works.map((w) => `
      <button class="card" data-id="${esc(w.id)}" aria-current="${current && current.work.id === w.id}">
        ${w.cover_id ? `<img loading="lazy" src="/admin/api/photos/${esc(w.cover_id)}" alt="">` : '<span class="ph"></span>'}
        <span><span class="chip ${esc(w.status)}">${esc(LABEL[w.status] || w.status)}</span>
        <h3>${esc(w.title)}</h3>
        <p>${esc(w.artist_name)}${w.artist_city ? ", " + esc(w.artist_city) : ""}</p>
        <p>Asks ${money(w.asking_price_usd)}${w.price_usd ? " · Gallery " + money(w.price_usd) : ""} · ${when(w.updated_at)}</p></span>
      </button>`).join("") || `<div class="empty">Nothing here.</div>`;
    $("#list").querySelectorAll(".card").forEach((c) => (c.onclick = () => open(c.dataset.id)));
  }

  async function open(id) {
    try { current = await api("/admin/api/works/" + encodeURIComponent(id)); }
    catch (e) { return toast(e.message); }
    $("#grid").classList.add("open");
    draw();
    document.querySelectorAll(".card").forEach((c) => c.setAttribute("aria-current", c.dataset.id === id));
    if (innerWidth < 980) scrollTo({ top: 0 });
  }

  function draw() {
    const { work: w, artist: a, photos, events, others } = current;
    const s = w.status;
    const btn = (action, label, cls = "") => `<button class="btn sm ${cls}" data-act="${action}">${label}</button>`;
    const acts = [];
    if (["submitted", "changes_requested"].includes(s)) acts.push(btn("approve", "Accept", "fill"));
    if (s === "approved") acts.push(btn("publish", "Put on the gallery", "fill"));
    if (s === "published") acts.push(btn("unpublish", "Take off the gallery"));
    if (["submitted", "approved"].includes(s)) acts.push(btn("request_changes", "Ask for changes"));
    if (["submitted", "changes_requested", "approved"].includes(s)) acts.push(btn("decline", "Decline", "quiet"));
    if (s === "declined") acts.push(btn("reopen", "Reopen"));
    acts.push(btn("save", "Save", "quiet"));
    const v = (x) => (x == null ? "" : esc(x));
    $("#detail").innerHTML = `
      <button class="link back" id="back">← All works</button>
      <div class="hero">
        ${photos.length ? `<img class="big" id="big" src="/admin/api/photos/${esc(photos[0].id)}" alt="">` : "<p class='muted'>No photos.</p>"}
        <div class="strip">${photos.map((p, i) => `<button data-src="/admin/api/photos/${esc(p.id)}" aria-current="${i === 0}"><img src="/admin/api/photos/${esc(p.id)}" alt="Photo ${i + 1}"></button>`).join("")}</div>
      </div>
      <span class="chip ${esc(s)}" style="margin-top:22px">${esc(LABEL[s] || s)}</span>
      <h2>${esc(w.title)}</h2>
      <p class="muted">${[w.year, w.medium, [w.height_cm, w.width_cm, w.depth_cm].filter((x) => x != null).join(" × ") + (w.height_cm ? " cm" : ""), w.framed ? "framed" : "unframed"].filter(Boolean).map(esc).join(" · ")}</p>
      <div class="two">
        <div class="panel"><h4>The work</h4>
          <dl class="kv"><dt>Artist asks</dt><dd><strong>${money(w.asking_price_usd)}</strong></dd><dt>Submitted</dt><dd>${when(w.created_at)}</dd><dt>Human-made</dt><dd>${w.human_made ? "Confirmed by the artist" : "Not confirmed"}</dd></dl>
          <p class="bio">${esc(w.description || "No description.")}</p>
        </div>
        <div class="panel"><h4>The artist</h4>
          <dl class="kv"><dt>Name</dt><dd>${esc(a.name)}</dd><dt>Email</dt><dd><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></dd>
          <dt>From</dt><dd>${esc([a.city, a.country].filter(Boolean).join(", ") || "—")}</dd>
          ${a.website ? `<dt>Website</dt><dd><a href="${esc(/^https?:/i.test(a.website) ? a.website : "https://" + a.website)}" target="_blank" rel="noopener noreferrer">${esc(a.website)}</a></dd>` : ""}
          ${a.instagram ? `<dt>Instagram</dt><dd><a href="https://instagram.com/${esc(a.instagram.replace(/^@/, ""))}" target="_blank" rel="noopener noreferrer">${esc(a.instagram)}</a></dd>` : ""}
          ${others.length ? `<dt>Other works</dt><dd>${others.map((o) => `<a href="#" data-open="${esc(o.id)}">${esc(o.title)}</a> <span class="muted">(${esc(LABEL[o.status] || o.status)})</span>`).join("<br>")}</dd>` : ""}</dl>
          <p class="bio">${esc(a.bio || "")}</p>
        </div>
      </div>
      <div class="cur">
        <div class="panel"><h4>Your decision</h4></div>
        <div class="fields">
          <label>Gallery price <span class="money"><input id="price_usd" inputmode="numeric" value="${v(w.price_usd ?? w.asking_price_usd)}"></span></label>
          <label>Shipping, India <span class="money"><input id="ship_india_usd" inputmode="numeric" value="${v(w.ship_india_usd)}" placeholder="0"></span></label>
          <label>Shipping, abroad <span class="money"><input id="ship_intl_usd" inputmode="numeric" value="${v(w.ship_intl_usd)}"></span></label>
          <label class="full">Note to the artist <span class="opt">shown on their status page when you ask for changes or decline</span><textarea id="note_to_artist" style="min-height:84px">${v(w.note_to_artist)}</textarea></label>
          <label class="full">Private note <span class="opt">only you see this</span><textarea id="admin_note" style="min-height:64px">${v(w.admin_note)}</textarea></label>
        </div>
        <details class="edit"><summary>Correct the artist's details</summary>
          <div class="fields" style="margin-top:14px">
            <label class="full">Title <input id="title" value="${v(w.title)}"></label>
            <label>Year <input id="year" value="${v(w.year)}"></label>
            <label>Medium <input id="medium" value="${v(w.medium)}"></label>
            <label>Framed <select id="framed"><option value="0" ${w.framed ? "" : "selected"}>No</option><option value="1" ${w.framed ? "selected" : ""}>Yes</option></select></label>
            <label>Height cm <input id="height_cm" value="${v(w.height_cm)}"></label>
            <label>Width cm <input id="width_cm" value="${v(w.width_cm)}"></label>
            <label>Depth cm <input id="depth_cm" value="${v(w.depth_cm)}"></label>
            <label class="full">Description <textarea id="description">${v(w.description)}</textarea></label>
          </div>
        </details>
        <div class="actions" id="acts">${acts.join("")}</div>
        <p class="ask">Accepting needs a gallery price and both shipping prices. Asking for changes needs a note to the artist. Accepted works go on the gallery only when you put them there.</p>
      </div>
      <ul class="log">${events.map((e) => `<li>${when(e.at)} · ${esc(e.action.replace(/_/g, " "))}${e.actor ? " · " + esc(e.actor) : ""}</li>`).join("")}</ul>`;

    $("#back").onclick = () => { $("#grid").classList.remove("open"); };
    $("#detail").querySelectorAll(".strip button").forEach((b) => (b.onclick = () => {
      $("#big").src = b.dataset.src;
      $("#detail").querySelectorAll(".strip button").forEach((x) => x.setAttribute("aria-current", x === b));
    }));
    $("#detail").querySelectorAll("[data-open]").forEach((l) => (l.onclick = (e) => { e.preventDefault(); open(l.dataset.open); }));
    $("#acts").querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => act(b.dataset.act)));
  }

  async function act(action) {
    const val = (id) => $("#" + id).value.trim();
    const body = { action };
    for (const k of ["price_usd", "ship_india_usd", "ship_intl_usd", "note_to_artist", "admin_note", "title", "year", "medium", "height_cm", "width_cm", "depth_cm", "description"]) body[k] = val(k);
    body.framed = $("#framed").value === "1";
    if (action === "decline" && !confirm("Decline this work? The artist will see “Not selected this time”.")) return;
    try {
      current = await api("/admin/api/works/" + encodeURIComponent(current.work.id), body);
      draw();
      toast({ save: "Saved", approve: "Accepted", publish: "On the gallery", unpublish: "Taken off the gallery", request_changes: "Sent back to the artist", decline: "Declined", reopen: "Reopened" }[action] || "Done");
      loadList();
    } catch (e) { toast(e.message); }
  }

  loadList().catch((e) => ($("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`));
})();
</script>
</body>
</html>
