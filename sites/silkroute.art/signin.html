<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="/"><img src="/markhor.svg" alt=""><span>silkroute<i>.art</i></span></a>
  <nav class="who"><a href="/join">Join</a></nav>
</div></header>

<main class="page">
  <p class="kicker">Custodians and artists</p>
  <h1>Sign <em>in</em></h1>
  <p class="lede">Enter your email and we&rsquo;ll send you a six-digit code. No passwords.</p>

  <form class="sect" data-auth="signin">
    <div class="hp" aria-hidden="true"><label for="hp">Leave this empty</label><input id="hp" name="company-website" tabindex="-1" autocomplete="off"></div>
    <div class="step1">
      <div class="fields">
        <label class="full" for="email">Email<input id="email" name="email" type="email" required autocomplete="email"></label>
      </div>
    </div>
      <div class="step2" hidden>
        <div class="fields">
          <label class="full" for="code">Six-digit code<input class="code-in" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="······"></label>
        </div>
        <p class="small">We sent it to <b class="sent-to"></b>. It works for ten minutes. Check your spam folder if it hasn&rsquo;t arrived.</p>
        <div class="row-links"><button type="button" class="link again">Send a new code</button><button type="button" class="link other">Use a different email</button></div>
      </div>
    <div class="notice bad auth-err" hidden role="alert"></div>
    <div class="actions"><button class="btn fill" type="submit">Send me a code <span class="a" aria-hidden="true">&rarr;</span></button></div>
  </form>

  <p class="small" style="margin-top:40px">New here? <a href="/join">Join the Journey</a>.</p>
  <footer class="foot"><a href="/">silkroute.art</a><a href="/ai-policy.html">AI policy</a><a href="/first-purchase.html">First purchase</a><a href="/privacy.html">Privacy</a></footer>
</main>
<script src="/auth.js" defer></script>

</html>
