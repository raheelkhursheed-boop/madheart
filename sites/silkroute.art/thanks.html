<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · silkroute.art</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EE;--soft:#EFEAE0;--soft-2:#EFEAE0;--ink:#1D1B18;--muted:#5F5A52;--faint:#8F897F;--line:#DCD5C8;--saffron:#B8641A;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;line-height:1.6;font-size:16.5px;font-weight:400;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:clamp(72px,10vw,140px) 20px 96px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(40px,5vw,64px);letter-spacing:-.03em;line-height:1.02;margin:0 0 24px;text-wrap:balance}
h2{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:26px;letter-spacing:-.015em;margin:44px 0 8px}
p,li,td{color:var(--muted)}
strong{color:var(--ink);font-weight:500}
a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--faint)}
a:hover{text-decoration-color:var(--saffron)}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
th{color:var(--ink);font-weight:500}
.btn{display:inline-flex;align-items:center;height:50px;padding:0 24px;margin-top:20px;background:transparent;color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink)}
.btn:hover{background:var(--ink);color:var(--bg)}
a:focus-visible{outline:2px solid var(--saffron);outline-offset:3px;border-radius:6px}
</style>
</head>
<body><main class="wrap">
<h1 id="t">Thank you. You’re on the list.</h1>
<p id="m">We’ll write when new artists and works are ready to see, before they open to everyone.</p>
<a class="btn" href="/">Back to silkroute.art</a>
<script>if(new URLSearchParams(location.search).get("for")==="artists"){document.getElementById("t").textContent="Thank you. We’ve received your application.";document.getElementById("m").textContent="Our curators read every application. If your work is a fit, we’ll be in touch to arrange a studio visit.";}</script>
</main></body>
</html>
