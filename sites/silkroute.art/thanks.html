<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · silkroute.art</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F2EF;--ink:#15171C;--muted:#5D626B;--lapis:#23419B;--saffron:#C4701C;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#0D1019;--ink:#ECEBE5;--muted:#A0A5B0;--lapis:#93ABFF;--saffron:#E89C4B;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:720px;margin:0 auto;padding:72px 24px}
h1{font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(38px,5vw,58px);line-height:1.05;margin:0 0 20px;text-wrap:balance}
h2{font-family:Gloock,Georgia,serif;font-weight:400;font-size:24px;margin:32px 0 8px}
p,li{color:var(--muted)} a{color:var(--lapis)}
.btn{display:inline-block;margin-top:12px;text-decoration:none;font-weight:600;color:#fff;background:var(--lapis);padding:12px 22px;border-radius:4px}
a:focus-visible{outline:2px solid var(--lapis);outline-offset:3px}
</style>
</head>
<body><main class="wrap">
<h1 id="t">Thank you. You’re on the list.</h1>
<p id="m">We’ll write when new artists and works are ready to see, before they open to everyone.</p>
<a class="btn" href="/">Back to silkroute.art</a>
<script>if(new URLSearchParams(location.search).get("for")==="artists"){document.getElementById("t").textContent="Thank you. We’ve received your application.";document.getElementById("m").textContent="Our curators read every application. If your work is a fit, we’ll be in touch to arrange a studio visit.";}</script>
</main></body>
</html>
